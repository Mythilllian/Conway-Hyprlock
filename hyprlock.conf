general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(10, 10, 12, 1.0)
    blur_passes = 0
}

label {
    monitor =
    text = cmd[update:16:true] ~/.config/hypr/conway_lockscreen/conway # update frequency can be modified here
    color = rgba(40, 200, 100, 0.8)
    font_size = 18
    font_family = JetBrains Mono
    position = 13, -5
    halign = left
    valign = top
}

label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = JetBrains Mono
    color = rgba(40, 200, 100, 0.8)
    position = 0, 87
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo -e "$(LC_TIME=en_US.UTF-8 date '+%b %d, %Y')"
    font_size = 25
    font_family = JetBrains Mono
    color = rgba(40, 200, 100, 0.8)
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_center = true
    rounding = 0

    dots_text_format = ■
    dots_size = 0.22
    dots_spacing = 0.35

    font_family = JetBrains Mono
    placeholder_text = Enter Password... 
    
    fail_text = FAILING GEN: $ATTEMPTS
    fail_color = rgba(243, 139, 168, 1.0)

    outer_color = rgba(40, 200, 100, 1.0)
    inner_color = rgba(17, 17, 27, 0.95)
    font_color = rgba(40, 200, 100, 1.0)
    fade_on_empty = false

    position = 0, -10
    halign = center
    valign = center
}
